name: Compilar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar o Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Preparar o Android SDK
        uses: android-actions/setup-android@v3

      - name: Dar permissão ao gradlew
        run: chmod +x ./gradlew

      - name: Compilar o APK (debug)
        run: ./gradlew assembleDebug --stacktrace

      - name: Guardar o APK pronto para download (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: MesaCerta-Impressora-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Renomear o APK com a versão
        run: cp app/build/outputs/apk/debug/app-debug.apk MesaCerta-Impressora.apk

      - name: Criar um link de download direto (Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MesaCerta Impressora - build ${{ github.run_number }}
          files: MesaCerta-Impressora.apk
          body: "APK gerado automaticamente. Baixe o arquivo abaixo e instale no celular."
