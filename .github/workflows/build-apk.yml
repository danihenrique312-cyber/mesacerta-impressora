name: Compilar APK

# Roda toda vez que enviamos código, ou manualmente pelo botão
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar o Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Preparar o Android SDK
        uses: android-actions/setup-android@v3

      - name: Dar permissão ao gradlew
        run: chmod +x ./gradlew

      - name: Compilar o APK (debug)
        run: ./gradlew assembleDebug --stacktrace

      - name: Guardar o APK pronto para download
        uses: actions/upload-artifact@v4
        with:
          name: MesaCerta-Impressora-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
